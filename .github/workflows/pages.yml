name: Build and Deploy Pages

# 访问地址：https://<owner>.github.io/<repo>/
#   - /index.json  合并后的索引，直接填进 KodakkuAssist 的 OnlineRepo
#   - /index.html  说明页
#
# 触发方式有两个，缺一不可：
#   1. push 到 main：维护者直接推送时生效
#   2. workflow_dispatch：自动合并用的是 GITHUB_TOKEN，它触发的 push 不会再触发 workflow，
#      所以 pr-auto-review.yml 在合并成功后会显式 dispatch 本 workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 生成合并索引
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 生成合并后的索引
        run: python3 .github/scripts/merge_repos.py --out _site

      - name: 上传站点内容
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
