name: Build and Deploy Pages

# 访问地址：https://<owner>.github.io/<repo>/
#   - /index.json             合并后的索引，填进 KodakkuAssist 的 OnlineRepo
#   - /                     说明页（贡献者、脚本数、冲突提示）
# 另外仓库根目录会生成一份同样的 OnlineRepo.json，可用 raw 直链订阅。
#
# 触发方式有两个，缺一不可：
#   1. push 到 main：维护者直接推送时生效
#   2. workflow_dispatch：自动合并用的是 GITHUB_TOKEN，它触发的 push 不会再触发 workflow，
#      所以 pr-auto-review.yml 在合并成功后会显式 dispatch 本 workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish-root 需要提交根目录的 OnlineRepo.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 生成索引
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 扫描 .cs 并生成合并索引
        run: python3 .github/scripts/merge_repos.py --out _site

      - name: 上传站点内容
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-root:
    name: 提交总索引到仓库根目录
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 生成根目录索引与 guid 映射表
        run: |
          python3 .github/scripts/merge_repos.py \
            --root-json OnlineRepo.json \
            --guid-map .github/index/guid-map.json \
            --no-site

      # 内容没变就不提交，避免每次重建都留一条空提交
      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain -- OnlineRepo.json .github/index/guid-map.json)" ]; then
            echo "索引与 guid 映射表都没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OnlineRepo.json .github/index/guid-map.json
          git commit -m "chore: 自动更新 OnlineRepo.json 与 guid 映射表"
          git push
